name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore MAFAgentLab.slnx

      - name: Build solution
        run: dotnet build MAFAgentLab.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --solution MAFAgentLab.slnx --configuration Release --no-build
